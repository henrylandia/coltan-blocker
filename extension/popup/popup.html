<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Coltan Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>🛡️ Coltan Blocker</h3>

  <div class="contadores">
    <div class="contador">
      <span class="numero" id="numBloqueados">0</span>
      <span class="etiqueta">Trackers bloqueados</span>
    </div>
    <div class="contador">
      <span class="numero" id="numCookies">0</span>
      <span class="etiqueta">Cookies eliminadas</span>
    </div>
    <div class="contador">
      <span class="numero" id="numPopups">0</span>
      <span class="etiqueta">Pop-ups bloqueados</span>
    </div>
    <div class="contador">
      <span class="numero" id="numStorage">0</span>
      <span class="etiqueta">Limpiezas storage</span>
    </div>
  </div>

  <button id="btnRegistro">Ver registro de actividad</button>

  <div id="panelRegistro" class="oculto">
    <div id="listaLog"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
